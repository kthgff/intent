<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0d10" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Veto — Agents propose. Humans veto.</title>
    <script>
      (function () {
        var stored = null;
        try {
          stored =
            localStorage.getItem("veto.theme") ||
            localStorage.getItem("intent.theme");
        } catch (e) {}
        var mode = stored === "light" || stored === "dark" ? stored : "system";
        var mq = matchMedia("(prefers-color-scheme: dark)");
        var apply = function () {
          document.documentElement.dataset.theme =
            mode === "system" ? (mq.matches ? "dark" : "light") : mode;
        };
        apply();
        // Track OS flips while mode is system; a stored override ignores them.
        mq.addEventListener("change", function () {
          var s = null;
          try {
            s =
              localStorage.getItem("veto.theme") ||
              localStorage.getItem("intent.theme");
          } catch (e) {}
          if (s !== "light" && s !== "dark") apply();
        });
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
